services:
  # Infrastructure
  postgres:
    image: postgres:16-alpine
    container_name: pikorua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pikorua
      POSTGRES_PASSWORD: pikorua
      POSTGRES_DB: pikorua_crm
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pikorua -d pikorua_crm']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pikorua-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Applications
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pikorua-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://pikorua:pikorua@postgres:5432/pikorua_crm
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SEND_URL: ${BREVO_SEND_URL:-https://api.brevo.com/v3/smtp/email}
      DEFAULT_SENDER_EMAIL: ${DEFAULT_SENDER_EMAIL:-pikoruaweb@gmail.com}
      DEFAULT_SENDER_NAME: ${DEFAULT_SENDER_NAME:-PIKORUA}
      WEBSITE_LEAD_SYNC_ENABLED: ${WEBSITE_LEAD_SYNC_ENABLED:-false}
      WEBSITE_SUPABASE_URL: ${WEBSITE_SUPABASE_URL:-}
      WEBSITE_SUPABASE_SERVICE_ROLE_KEY: ${WEBSITE_SUPABASE_SERVICE_ROLE_KEY:-}
      MICROSITE_LEAD_SYNC_ENABLED: ${MICROSITE_LEAD_SYNC_ENABLED:-false}
      MICROSITE_LEAD_SOURCES_JSON: ${MICROSITE_LEAD_SOURCES_JSON:-[]}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: pikorua-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
